<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn lồng tan chảy - Nến mờ ảo</title>
    <style>
        /* Cài đặt tổng quan */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Vùng chứa bầu trời trái tim */
        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .heart-star {
            position: absolute;
            color: #ff4d6d;
            animation: twinkle linear infinite;
            filter: drop-shadow(0 0 5px #ff4d6d);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Khu vực hiển thị trung tâm */
        #scene {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ---- ĐÈN LỒNG ---- */
        #lantern-container {
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s;
        }

        #lantern-container:hover .lantern-body {
            box-shadow: 0 0 40px rgba(255, 100, 0, 0.9), inset 0 0 30px rgba(255, 200, 0, 0.7);
        }

        .lantern-top, .lantern-bottom {
            width: 70px;
            height: 15px;
            background: #2c1a0e;
            border-radius: 5px;
            border: 2px solid #5a341b;
            z-index: 2;
        }

        .lantern-body {
            width: 130px;
            height: 160px;
            background: rgba(255, 69, 0, 0.6);
            border-radius: 50px 50px 40px 40px;
            box-shadow: 0 0 30px rgba(255, 100, 0, 0.8), inset 0 0 20px rgba(255, 255, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 15px;
            position: relative;
            overflow: hidden;
            
            /* Thêm hiệu ứng mờ nhẹ cho bên trong đèn lồng */
            backdrop-filter: blur(2px);
        }

        /* Nan dọc của đèn lồng */
        .lantern-body::before, .lantern-body::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 100%;
            border: 2px solid rgba(139, 0, 0, 0.3);
            border-top: none;
            border-bottom: none;
            border-radius: 50%;
            top: 0;
        }
        .lantern-body::after {
            width: 90px;
        }

        /* Nến và Lửa - đã được chỉnh mờ hơn */
        .candle {
            width: 24px;
            height: 45px;
            background: #fff8e7;
            border-radius: 4px;
            position: relative;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2);
            z-index: 3;
            
            /* Làm cho nến mờ và trong suốt hơn một chút */
            opacity: 0.6;
            filter: blur(1px);
        }

        .flame {
            position: absolute;
            top: -24px;
            left: 5px;
            width: 14px;
            height: 22px;
            background: #ffcc00;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 0 15px #ffcc00, 0 0 30px #ff6600, 0 -10px 20px #ff0000;
            animation: flicker 0.15s infinite alternate;
            
            /* Làm cho lửa mờ và mềm mại hơn */
            opacity: 0.7;
            filter: blur(1px);
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 1; }
            100% { transform: scale(1.1) rotate(3deg); opacity: 0.85; }
        }

        /* Hiệu ứng tan chảy (được gọi bằng JS) */
        @keyframes meltDown {
            0% { 
                transform: scale(1); 
                filter: blur(0); 
            }
            40% { 
                transform: scaleY(0.7) scaleX(1.1) translateY(20%); 
                border-radius: 50% 50% 30% 30%; 
                background: rgba(255, 30, 0, 0.9);
                filter: blur(2px);
            }
            80% {
                transform: scaleY(0.2) scaleX(1.5) translateY(150%);
                filter: blur(8px);
                opacity: 0.5;
            }
            100% { 
                transform: scaleY(0) scaleX(2) translateY(250%); 
                filter: blur(15px); 
                opacity: 0; 
            }
        }

        .melt-effect {
            animation: meltDown 2s forwards ease-in;
            pointer-events: none;
        }

        /* ---- ẢNH VÀ CHỮ ẨN ---- */
        #reveal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%) scale(0.8);
            opacity: 0;
            text-align: center;
            pointer-events: none;
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 20;
        }

        #reveal-content.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        /* Khung ảnh */
        #reveal-content img {
            max-width: 80vw;
            max-height: 60vh;
            border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 30px rgba(255, 105, 180, 0.6);
            border: 4px solid #fff;
            object-fit: cover;
        }

        /* Chữ dưới ảnh */
        #reveal-content p {
            color: #fff;
            font-size: 26px;
            margin-top: 20px;
            text-shadow: 0 0 10px #ffb6c1, 0 0 20px #ff69b4;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Nơi chứa bầu trời trái tim -->
    <div id="stars-container"></div>

    <div id="scene">
        <!-- Cụm đèn lồng -->
        <div id="lantern-container" onclick="meltLantern()">
            <div class="lantern-top"></div>
            <div class="lantern-body">
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
            <div class="lantern-bottom"></div>
        </div>

        <!-- Ảnh và chữ bí mật -->
        <div id="reveal-content">
            <!-- Thay đường dẫn ảnh của bạn vào thuộc tính src dưới đây -->
            <img src="dep.hong.jpg" alt="Bức ảnh bí mật">
            <!-- Thay chữ của bạn ở đây -->
            <p> This is a gift for PTT.</p>
        </div>
    </div>

    <script>
        // 1. Tạo hiệu ứng trái tim lấp lánh ở background
        const starsContainer = document.getElementById('stars-container');
        const numberOfHearts = 70; // Số lượng trái tim

        for(let i = 0; i < numberOfHearts; i++) {
            let heart = document.createElement('div');
            heart.classList.add('heart-star');
            heart.innerHTML = '❤️';
            
            // Vị trí ngẫu nhiên
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = Math.random() * 100 + 'vh';
            
            // Kích thước ngẫu nhiên (từ 5px đến 20px)
            let size = Math.random() * 15 + 5; 
            heart.style.fontSize = size + 'px';
            
            // Tốc độ nhấp nháy và độ trễ ngẫu nhiên
            heart.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
            heart.style.animationDelay = Math.random() * 3 + 's';
            
            // Xoay ngẫu nhiên
            heart.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            starsContainer.appendChild(heart);
        }

        // 2. Hàm xử lý khi click vào đèn lồng
        function meltLantern() {
            const lanternContainer = document.getElementById('lantern-container');
            const revealContent = document.getElementById('reveal-content');

            // Thêm class để chạy hiệu ứng CSS tan chảy
            lanternContainer.classList.add('melt-effect');
            
            // Đợi 1.8 giây (gần kết thúc hiệu ứng tan chảy) thì hiện ảnh và chữ lên
            setTimeout(() => {
                lanternContainer.style.display = 'none'; // Ẩn hẳn đèn lồng
                revealContent.classList.add('show');     // Hiển thị ảnh & chữ
            }, 1800);
        }
    </script>
</body>
</html>
